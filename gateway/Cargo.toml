[package]
name = "gateway"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
arc-swap = "1.8.0"
axum = { version = "0.8.7", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"]}
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
crossbeam = "0.8.4"
dashmap = "6.1.0"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = [
    "client",
    "http1",
    "http2",
    "tokio",
] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
lazy_static = "1.5"
matchit = "0.9.0"
moka = { version = "0.12.12", features = ["sync"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1.0"
notify = "8.2.0"
parking_lot = "0.12.5"
rand = { version = "0.9.2", features = ["alloc"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde_yaml = "0.9.33"
smallvec = "1.15.1"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
redis = { version = "1.0.4", features = ["tokio-comp"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["async_tokio"] }
hyper-util = { version = "0.1.19", features = ["client-legacy"] }
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "flow"
path = "benchmarks/flow.rs"
harness = false
